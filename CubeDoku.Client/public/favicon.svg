<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradients for 3D isometric cube faces -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DDD6FE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4C1D95" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Isometric Cube with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Top Face -->
    <polygon points="32,6 56,19 32,32 8,19" fill="url(#topFace)"/>
    
    <!-- Left Face -->
    <polygon points="8,19 32,32 32,58 8,45" fill="url(#leftFace)"/>
    
    <!-- Right Face -->
    <polygon points="32,32 56,19 56,45 32,58" fill="url(#rightFace)"/>
  </g>

  <!-- Sudoku / Rubik's Grid Lines -->
  <!-- Top Face Grid -->
  <path d="M16,14.67 L40,27.67 M24,10.33 L48,23.33 M44,12.67 L20,25.67 M48,14.83 L24,27.83" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M16,14.67 L40,27.67 M24,10.33 L48,23.33 M40,10.33 L16,23.33 M48,14.67 L24,27.67" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="0.75"/>

  <!-- Left Face Grid -->
  <line x1="16" y1="23.33" x2="16" y2="49.33" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.75"/>
  <line x1="24" y1="27.67" x2="24" y2="53.67" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.75"/>
  <line x1="8" y1="27.67" x2="32" y2="40.67" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.75"/>
  <line x1="8" y1="36.33" x2="32" y2="49.33" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.75"/>

  <!-- Right Face Grid -->
  <line x1="40" y1="27.67" x2="40" y2="53.67" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.75"/>
  <line x1="48" y1="23.33" x2="48" y2="49.33" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.75"/>
  <line x1="32" y1="40.67" x2="56" y2="27.67" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.75"/>
  <line x1="32" y1="49.33" x2="56" y2="36.33" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.75"/>

  <!-- Inner Edge Highlights -->
  <polyline points="8,19 32,32 56,19" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1"/>
  <line x1="32" y1="32" x2="32" y2="58" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"/>
  <polyline points="8,19 32,6 56,19 56,45 32,58 8,45 8,19" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>
</svg>
